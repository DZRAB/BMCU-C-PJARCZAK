; ============================================================================
; platformio.ini — PlatformIO 项目配置文件（非编译脚本）
;
; 本文件是编译系统的"配置"，不是脚本。所有 `pio run` 都依赖它：PlatformIO
; 读取本文件决定如何编译（目标芯片 CH32V203、144MHz、noneos-sdk 框架）。
; 例如 `pio run -e moj` 即使用下方 [env:moj] 这一段配置；删掉本文件 pio 无法工作。
;
; 回抽长度（AMS_RETRACT_LEN）说明：
;   - 回抽长度可自定义：SOLO 固定 0.095 米（9.5 cm）；AMS_A~D 支持 0.10~2.00 米（步长 5cm，共 39 档），可由编译参数/环境变量指定。
;   - 实际批量/单独编译走 [env:fw] + 环境变量 AMS_RETRACT_LEN（由一键脚本或
;     build_one.sh 传入），已覆盖全部档位。
;   - 下方的 ams_a_xxx ~ ams_d_xxx 环境仅"列举常用回抽长度（0.10~0.90 米）"，
;     并非穷举，仅供手动 `pio run -e ams_a_030` 图方便；需要其它长度请用 fw 环境。
; ============================================================================

[platformio]

[env:base]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
framework = noneos-sdk
board = genericCH32V203C8T6

board_upload.maximum_size = 61440
build_type = release
board_build.use_lto = yes
board_build.use_builtin_debug_code = no
board_build.cpp_support = yes


build_flags =
    -DSYSCLK_FREQ_144MHz_HSI=144000000

      ; --- Hardware variants ---
;DM board: dual microswitch + autoload (first switch assist)
;    -DBMCU_DM_TWO_MICROSWITCH=1

; --- LEDs: show filament RGB on ONLINE LED when loaded ---
;    -DBMCU_ONLINE_LED_FILAMENT_RGB=1

; --- P1 / X1 / P2 Printer ---
;  -DBMCU_P1S=1

; --- Soft load ---
;    -DBMCU_SOFT_LOAD=1

[env:fw]
extends = env:base
build_flags =
  ${env:base.build_flags}
  -DBMCU_DM_TWO_MICROSWITCH=${sysenv.BMCU_DM_TWO_MICROSWITCH}
  -DBMCU_ONLINE_LED_FILAMENT_RGB=${sysenv.BMCU_ONLINE_LED_FILAMENT_RGB}
  -DBMCU_P1S=${sysenv.DBMCU_P1S}
  -DBMCU_SOFT_LOAD=${sysenv.BMCU_SOFT_LOAD}
  -DBAMBU_BUS_AMS_NUM=${sysenv.BAMBU_BUS_AMS_NUM}
  -DAMS_RETRACT_LEN=${sysenv.AMS_RETRACT_LEN}

[env:moj]
extends = env:base
build_flags =
  ${env:base.build_flags}
  -DBAMBU_BUS_AMS_NUM=0
  -DAMS_RETRACT_LEN=0.095f


